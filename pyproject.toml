[project]
name = "aws-portfolio-vis"
version = "0.1.0"
description = "Aplicación de Streamlit para análisis de portafolio utilizando AWS Athena y Bedrock."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "awswrangler>=3.16.1",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "streamlit>=1.57.0",
    "yfinance>=1.3.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "isort>=8.0.1",
    "jupyterlab>=4.5.7",
    "pytest>=9.0.3",
]
